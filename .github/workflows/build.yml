name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: DuneSaveManager-windows
          path: |
            target/release/DuneSaveManager.exe
            target/release/DuneSaveManagerCLI.exe