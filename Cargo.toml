[package]
name = "DuneSaveManager"
version = "1.0.2"
edition = "2021"
description = "Save + character manager for Dune: Awakening solo mode"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
flate2 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

eframe = { version = "=0.27.2", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui_extras = { version = "=0.27.2", features = ["file", "image"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", default-features = false, features = ["wgc"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lib]
name = "dune_save_manager"
path = "src/lib.rs"

[[bin]]
name = "DuneSaveManagerCLI"
path = "src/main.rs"

[[bin]]
name = "DuneSaveManager"
path = "src/bin/gui.rs"

[profile.release]
opt-level = 3
strip = true